finance_copilot:
  # Demo is the default, so checks and CI never touch real data.
  target: demo
  outputs:
    demo:
      type: duckdb
      path: "{{ env_var('FINANCE_COPILOT_DEMO_WAREHOUSE', 'data/demo/warehouse.duckdb') }}"
      threads: 4
    private:
      type: duckdb
      path: "{{ env_var('FINANCE_COPILOT_WAREHOUSE', 'data/warehouse.duckdb') }}"
      threads: 4
