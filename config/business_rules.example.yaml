# Copy to data/private/business_rules.yaml. The copy is gitignored.
# Accounts with mixed use are private by default. Only matches count as business.
# A term matches whole words in the counterparty, or in the text if there is none.
income:
  - Example Customer GmbH
expense:
  - SVS
  - Example Software Vendor
# Tax payments are tracked separately and do not reduce profit.
tax:
  - Finanzamt
# Expenses you pay from your Scalable pot. List them under expense as well.
reserve_paid:
  - SVS
# Vendors with private and business purchases. Each booking is decided with `decide`.
mixed:
  - Example Electronics Store
