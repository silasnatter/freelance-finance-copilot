[project]
name = "freelance-finance-copilot"
version = "0.1.0"
description = "Local-first analytics platform for freelance finances with dbt, Dagster and an LLM layer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "dlt[duckdb]>=1.5",
    "duckdb>=1.5,<2",
    "faker>=30",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PTH", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["finance_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=finance_copilot --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source_pkgs = ["finance_copilot"]
